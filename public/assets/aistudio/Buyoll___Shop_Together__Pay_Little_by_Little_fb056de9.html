<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Buyoll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0618"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#0b0618;--card:#1a0f33;--pu:#7c3aed;--pu2:#a855f7;--ye:#ffc928;--tx:#fff;--mu:#b9afd6;--gr:#22c55e;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}
html,body{height:100%;background:radial-gradient(circle at 50% 0,#2a0f5e,#07030f 70%);color:var(--tx)}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);box-shadow:0 0 40px #7c3aed66;overflow:hidden}
main{flex:1;overflow-y:auto;padding:12px 14px 90px}
h1,h2,h3{margin:0}.mu{color:var(--mu);font-size:12px}.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:700;font-size:17px;justify-content:space-between}
.card{background:var(--card);border:1px solid #7c3aed66;border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 0 14px #7c3aed33}
.w{background:#fff;color:#1b1030;border-radius:16px;padding:12px;margin:10px 0}.w .mu{color:#555}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6d28d9,#a855f7);font-size:14px}
.y{background:var(--ye);color:#1b1030}.o{background:transparent;border:1px solid var(--pu2)}.sm{padding:7px 16px;border-radius:10px}.bl{width:100%;padding:13px}
.price{color:#e11d48;font-weight:800;font-size:20px}.old{text-decoration:line-through;color:#888;font-size:13px;margin-left:6px}
.pimg{border-radius:12px;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle at 30% 30%,#fff 0 8%,transparent 9%),radial-gradient(circle at 70% 60%,#f43f5e 0 10%,transparent 11%),linear-gradient(135deg,#4c1d95,#7c3aed 60%,#2e1065)}
.pimg.b{background:repeating-linear-gradient(45deg,#dc2626 0 10px,#f97316 10px 20px)}
.ban{background:linear-gradient(120deg,#f59e0b,#7c3aed 55%,#3b0764);border-radius:18px;padding:18px;margin:10px 0}
.ban h2{font-size:30px}.ban b{color:var(--ye)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #7c3aed88;background:#120a26;color:#fff;font-size:14px;margin:6px 0}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#0f0822ee;border-top:1px solid #7c3aed66;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}nav a i{display:block;font-style:normal;font-size:20px}nav a.on{color:var(--ye)}
nav .fab{width:54px;height:54px;border-radius:50%;background:var(--ye);margin:-26px auto 0;display:grid;place-items:center;font-size:24px;box-shadow:0 0 16px #ffc928aa}
.grp{display:flex;align-items:center;gap:10px;background:#1d1238;border:1px solid #7c3aed55;border-radius:14px;padding:10px;margin:8px 0}
.grp .ic{font-size:26px;background:#2b1a52;border-radius:10px;padding:6px}.grp>div{flex:1}
.bal{background:linear-gradient(135deg,#5b21b6,#a855f7);border-radius:18px;padding:16px;margin:10px 0}
.bd{background:var(--gr);color:#04210f;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}.bd.r{background:var(--rd);color:#fff}.bd.p{background:var(--ye);color:#222}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#1d1238;border:1px solid #7c3aed66;border-radius:12px;text-align:center;padding:10px 4px}.stats b{font-size:20px;display:block}
.tabs{display:flex;background:#1a0f33;border-radius:12px;padding:3px;margin:12px 0}.tabs a{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--mu)}.tabs a.on{background:#fff;color:#1b1030;font-weight:700}
.mod{position:absolute;inset:0;background:#000b;display:grid;place-items:end center;z-index:9}.mod>div{background:#150b2c;border:1px solid var(--pu);border-radius:20px 20px 0 0;width:100%;padding:18px}
.days{display:flex;gap:3px;margin-top:6px}.days i{flex:1;text-align:center;font-style:normal;font-size:11px;border-radius:5px;background:#2b1a52;padding:3px 0}.days i.d{background:var(--gr);color:#000}
.tx{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff14}.tx .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#2b1a52}
.chip{display:flex;gap:6px;font-size:11px;justify-content:space-around;margin:8px 0;color:#4c1d95}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gs div{border:1px solid #c4b5fd;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:#333}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--gr);color:#041;padding:8px 14px;border-radius:20px;font-weight:700;font-size:13px;z-index:20;display:none}
.logo{font-size:52px;text-align:center}

#app{max-width:none;height:auto;min-height:100%;overflow:visible;box-shadow:none;background:transparent}
body{overflow-y:auto}main{overflow:visible;width:100%;max-width:1000px;margin:0 auto;padding:16px 14px 100px}
nav{position:fixed;z-index:10}.brand{display:none}
.mod{position:fixed;place-items:center;padding:14px}.mod>div{max-width:440px;border-radius:20px}
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}#feed .w{margin:0}
.ban{padding:34px 30px}.ban h2{font-size:clamp(30px,5vw,48px)}
@media(min-width:760px){main{padding:24px 20px 40px}nav{position:sticky;top:0;order:-1;justify-content:center;gap:6px;border:0;border-bottom:1px solid #7c3aed66;padding:10px 24px;background:#0b0618f2;backdrop-filter:blur(8px)}
.brand{display:block;font-size:22px;font-weight:800;margin-right:auto}nav a{flex:none;padding:6px 14px;font-size:14px}nav a i{display:inline;margin-right:6px;font-size:16px}
nav .fab{width:auto;height:auto;border-radius:20px;padding:6px 14px;margin:0;font-size:16px}.stats b{font-size:26px}}
.two{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}:root{--bg:#f4f2fa;--card:#fff;--tx:#1b1030;--mu:#6b6384;--ln:#e6e1f3}
html,body{background:var(--bg);color:var(--tx)}#app{background:transparent}
main{max-width:1180px;padding:16px 14px 96px}
.card,.w,.grp,.stats div{background:#fff;color:var(--tx);border:1px solid var(--ln);box-shadow:0 1px 3px #1b103012}
.grp .ic{background:#efe9ff}input,select{background:#fff;color:var(--tx);border:1px solid #d9d2ec}
.tabs{background:#ebe7f6}.mod>div{background:#fff;color:var(--tx);border:0}.days i{background:#ece8f6;color:#6b6384}.days i.d{color:#fff}
.tx{border-color:var(--ln)}.tx .ic{background:#efe9ff}.btn.o{background:#fff;color:#6d28d9;border:1px solid #c4b5fd}.btn.y{color:#1b1030}
.ban,.bal{color:#fff}.ban .mu,.bal .mu{color:#eadcff}.ban{padding:22px 24px}.ban h2{font-size:clamp(22px,4vw,34px)}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(90deg,#2e1065,#5b21b6);color:#fff}
.brand2{font-size:22px;font-weight:800}.brand2 span{color:var(--ye)}.rl{margin-left:auto;font-size:11px;text-transform:uppercase;background:#ffffff26;border-radius:8px;padding:3px 8px}
.dn{display:none;flex:1;gap:4px;margin-left:16px}.dn a{color:#e9defc;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:14px}.dn a.on{background:#ffffff2e;color:#fff;font-weight:700}
.bell{position:relative;cursor:pointer;font-size:20px}.bell i{position:absolute;top:-6px;right:-8px;background:var(--rd);font-size:10px;border-radius:9px;padding:1px 5px;font-style:normal}
.bn{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bn a{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}.bn a i{display:block;font-style:normal;font-size:20px}.bn a.on{color:#6d28d9;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pc{background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s}.pc:hover{box-shadow:0 6px 18px #5b21b633}
.ph{position:relative}.ph .bg{position:absolute;top:8px;left:8px;background:var(--rd);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.bd2{padding:10px;display:flex;flex-direction:column;gap:3px}.nm{font-size:14px;font-weight:600;line-height:1.3;min-height:2.6em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.steps div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px}
.gcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:6px}
@media(min-width:760px){.dn{display:flex}.bn{display:none}main{padding:24px 20px 40px}.pg{grid-template-columns:repeat(4,1fr);gap:14px}}
.wa{background:#1f2c34;color:#e9edef;border-radius:14px;padding:14px 16px;line-height:1.75;font-size:15px;margin:8px 0;box-shadow:0 2px 8px #0003}.wa2{color:#8696a0;font-size:13px;display:inline}
.tkb{border:0;background:#25d366;color:#04210f;border-radius:50%;width:22px;height:22px;font-weight:700;cursor:pointer;margin-left:4px;vertical-align:middle}</style></head><body><div id="app"></div><div id="toast"></div>
<script>
// ---------- MOCK BACKEND (in-memory + localStorage) ----------
const def=()=>({role:null,tab:'home',view:null,sel:null,name:'Amina',wallet:1250,pend:0,loanCr:1000,
tx:[{t:'Group Contribution',a:-124,d:'Today, 8:20 AM',k:'c'},{t:'Loan Received',a:1000,d:'Yesterday, 4:30 PM',k:'l'},{t:'Purchase Payment',a:-620,d:'Nov 20, 2026',k:'p'}],
products:[{id:1,n:'6pc Cotton Bedsheets (Queen Size)',p:6200,o:7500,m:"Betty's Shop",e:'🛏️',desc:'Soft and stylish cotton bedsheets with matching pillow cases. Perfect for your home.',g:[1,2,4,5,6,7,8,9,10,3].map((c,i)=>({n:'ABCDEFGHIJ'[i],c,j:0}))},
{id:2,n:'5 by 6 Mattress (High Quality)',p:8000,o:9500,m:"Betty's Shop",e:'🛌',b:1,desc:'Comfortable mattress for your home.',g:[2,4,5].map((c,i)=>({n:'ABC'[i],c,j:0}))}],
my:[],deposits:[{id:1,by:"Betty's Shop",amt:1000,code:'QF9387421',st:'pending'}],reqs:[{who:'John Kamau',score:760,amt:2000,loc:'Nairobi'}],
loans:[{id:'#LN-001',amt:2000,st:'Active'},{id:'#LN-002',amt:1500,st:'Paid'}],lent:25000,earned:1250,rev:125000,users:8750,merch:12450,mw:12450});
let S=def();try{const x=localStorage.getItem('buyoll2');if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem('buyoll2',JSON.stringify(S))}catch(e){}};
const inst=(p,c)=>(p/(c*10)).toFixed(0), K=n=>'KSh '+Number(n).toLocaleString();
const api={
 deposit(code,amt){if(S.deposits.some(d=>d.code===code))return 'Duplicate M-Pesa code';S.deposits.unshift({id:Date.now(),by:S.name,amt:+amt,code,st:'pending',mem:1});S.pend+=+amt},
 decide(id,ok){const d=S.deposits.find(x=>x.id==id);d.st=ok?'approved':'declined';if(d.mem){S.pend-=d.amt;if(ok){S.wallet+=d.amt;S.tx.unshift({t:'M-Pesa Deposit',a:d.amt,d:'Just now',k:'l'})}}},
 join(pid,gn){const p=S.products.find(x=>x.id==pid),g=p.g.find(x=>x.n==gn);if(g.j>=g.c)return 'Group is full';if(S.my.some(m=>m.pid==pid&&m.g==gn))return 'Already in this group';g.j++;S.my.push({pid,g:gn,pos:g.j,paid:0})},
 pay(i){const m=S.my[i],p=S.products.find(x=>x.id==m.pid),g=p.g.find(x=>x.n==m.g),a=+inst(p.p,g.c);if(S.wallet<a)return 'Insufficient wallet balance';if(m.paid>=10)return 'Cycle complete';S.wallet-=a;m.paid++;S.tx.unshift({t:'Group Contribution',a:-a,d:'Just now',k:'c'})},
 lend(i){const r=S.reqs[i],net=r.amt-50;S.rev+=50;S.lent+=r.amt;S.earned+=50*0;S.loans.unshift({id:'#LN-00'+(S.loans.length+1),amt:r.amt,st:'Active'});if(r.me){S.wallet+=net;S.loanCr+=net;S.tx.unshift({t:'Loan Received',a:net,d:'Just now',k:'l'})}S.reqs.splice(i,1)}
};
// ---------- UI ----------
const A=document.getElementById('app');
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const go=(tab,view,sel)=>{S.tab=tab;S.view=view||null;S.sel=sel??null;save();draw()};
const out=m=>{if(m)toast(m);else save();draw()};
const modal=h=>{const d=document.createElement('div');d.className='mod';d.onclick=e=>{if(e.target==d)d.remove()};d.innerHTML='<div>'+h+'</div>';A.appendChild(d);window.cm=()=>d.remove()};
const prodImg=(p,h=90,w='100%')=>`<div class="pimg ${p.b?'b':''}" style="height:${h}px;width:${w};flex:none">${p.e}</div>`;
const hd=(t,back)=>`<div class="top">${back?`<span style="cursor:pointer" onclick="go('${back}')">←</span>`:'<span>☰</span>'}<span>${t}</span><span>${back?'♡':'⟳'}</span></div>`;
const NAV={member:[['home','🏠','Home'],['groups','👥','Groups'],['shop','🛒',''],['wallet','👛','Wallet'],['profile','👤','Profile']],
merchant:[['home','🏠','Home'],['products','📦','Products'],['wallet','👛','Wallet'],['profile','👤','Profile']],
lender:[['home','🏠','Home'],['loans','💰','Loans'],['wallet','👛','Wallet'],['profile','👤','Profile']],
admin:[['home','📊','Dashboard'],['users','👥','Users'],['products','📦','Products'],['fin','🔒','Finance']]};
function draw(){
 if(!S.role){A.innerHTML=login();return}
 const n=NAV[S.role].map(([k,i,l])=>k=='shop'?`<a onclick="go('home')"><div class="fab">${i}</div></a>`:`<a class="${S.tab==k&&!S.view?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</a>`).join('');
 A.innerHTML=`<nav><b class="brand">🛒 Buy<span style="color:var(--ye)">oll</span></b>${n}</nav><main>${V[S.role]()}</main>`;
}
let lr='member';
function login(){return `<main style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;max-width:440px;margin:0 auto;overflow:visible"><div class="logo">🛒</div><h1 style="text-align:center;font-size:44px">Buy<span style="color:var(--ye)">oll</span></h1><p style="text-align:center;margin:6px 0 4px">Shop Together, Pay Little by Little!</p>
<div class="tabs">${['member','merchant','lender'].map(r=>`<a class="${lr==r?'on':''}" onclick="lr='${r}';draw()">${r[0].toUpperCase()+r.slice(1)}</a>`).join('')}</div>
<label class="mu">Phone Number</label><input id="ph" placeholder="Enter your phone number" value="0712345678"><label class="mu">Password</label><input id="pw" type="password" placeholder="Enter password" value="demo1234">
<button class="btn y bl" onclick="S.role=lr;S.tab='home';S.view=null;save();draw()">Login →</button>
<div class="row sp" style="margin-top:12px;font-size:13px"><span style="color:var(--ye)">Forgot Password?</span><span onclick="S.role='admin';S.tab='home';draw()" style="cursor:pointer">Create Account · <u>Admin</u></span></div>
<p class="mu" style="text-align:center;margin-top:18px">Demo mode: any credentials work. Data is a local mock backend.</p></main>`}
const out2=()=>{S.role=null;save();draw()};
const prof=()=>`${hd('Profile')}<div class="card"><h3>${S.name}</h3><p class="mu">${S.role}</p></div><button class="btn o bl" onclick="out2()">Log out</button><button class="btn o bl" style="margin-top:8px" onclick="S=def();save();draw()">Reset demo data</button>`;
const txList=()=>S.tx.filter(t=>(t.r||'member')==S.role).slice(0,6).map(t=>`<div class="tx"><div class="ic">${t.k=='c'?'⬆':t.k=='l'?'👤':'🛒'}</div><div style="flex:1"><b>${t.t}</b><div class="mu">${K(Math.abs(t.a))}</div></div><span class="mu">${t.d}</span></div>`).join('');
const walletView=(bal,who)=>`${hd('My Wallet')}<div class="bal"><div class="row sp"><div class="row"><span style="font-size:36px">👛</span><div><span class="mu" style="color:#eadcff">Private ${S.role} wallet · Balance</span><h2 style="font-size:30px">${K(bal)}</h2></div></div><span class="bd">Active</span></div>
${(()=>{const q=S.deposits.filter(d=>d.st=='pending'&&d.role==S.role).reduce((a,d)=>a+d.amt,0);return q?`<p class="mu" style="color:#fde68a;margin-top:6px">Pending deposits: ${K(q)}</p>`:''})()}
<div class="row" style="margin-top:10px"><button class="btn y bl" onclick="depM()">⬆ Deposit</button></div></div>
<div class="row sp"><h3>Recent Transactions</h3><span class="mu" style="color:var(--pu2)">See All →</span></div><div class="card">${txList()}</div>`;
function depM(){modal(`<h3>Deposit via M-Pesa</h3><p class="mu">Pay to Till <b>1615904</b> (Buyoll), then enter details. Admin verifies before crediting.</p><input id="dc" placeholder="M-Pesa code e.g. QF9387421"><input id="da" type="number" placeholder="Amount paid"><button class="btn y bl" onclick="const r=api.deposit(dc.value.trim().toUpperCase(),da.value);if(!dc.value||!da.value)return toast('Fill all fields');cm();out(r||(toast('Deposit pending verification'),''))">Submit</button>`)}
const V={
member(){
 const t=S.tab,v=S.view;
 if(t=='home'&&v=='prod'){const p=S.products.find(x=>x.id==S.sel);return `${hd('Product Details','home')}${prodImg(p,200)}<div style="margin-top:10px"><span class="price" style="font-size:26px">${K(p.p)}</span><span class="old">${K(p.o)}</span> <span class="bd p">Hot Deal 🔥</span></div><h2 style="font-size:20px;margin:6px 0">${p.n}</h2><p class="mu">${p.desc}</p>
 <div class="row sp mu" style="margin:12px 0"><span>✔ Trusted Seller</span><span>🛡 Secure Community</span><span>💸 Pay Little</span></div><div class="row sp"><h3>Choose Group (1–10 Members)</h3><a style="color:var(--pu2);font-size:12px;cursor:pointer" onclick="go('groups','list',${p.id})">See All →</a></div>
 <div class="gs" style="margin:10px 0">${p.g.slice(0,3).map(g=>`<div style="background:#1d1238;color:#fff;border-color:#7c3aed"><b>Group ${g.n}</b><br>${g.c} Member${g.c>1?'s':''}<br>${K(inst(p.p,g.c))}/day<br><button class="btn sm" style="margin-top:4px;padding:4px 14px" onclick="jn(${p.id},'${g.n}')">Join</button></div>`).join('')}</div>
 <button class="btn y bl" onclick="go('groups','list',${p.id})">Join Group Now →</button>`}
 if(t=='groups'){const p=S.products.find(x=>x.id==(S.sel||1));return `${hd('Groups You Can Join','home')}<div class="w row">${prodImg(p,70,'90px')}<div><b>${p.n}</b><div class="price">${K(p.p)}</div><span class="mu">👥 ${p.g.length} Groups Available</span></div></div>
 ${p.g.map(g=>`<div class="grp"><span class="ic">👥</span><div><b>Group ${g.n}</b><div class="mu">${g.c} Member${g.c>1?'s':''} · ${K(inst(p.p,g.c))}/day · ${g.c-g.j} slots</div></div><button class="btn sm" onclick="jn(${p.id},'${g.n}')">Join</button></div>`).join('')}
 <div class="card row">🛡 <span>Join a group and start contributing daily for 10 days!</span></div>`}
 if(t=='wallet'&&v=='mine')return `${hd('My Groups','wallet')}${S.my.length?S.my.map((m,i)=>{const p=S.products.find(x=>x.id==m.pid),g=p.g.find(x=>x.n==m.g);return `<div class="card"><b>${p.n}</b><div class="mu">Group ${m.g} · Position ${m.pos}/${g.c} · ${K(inst(p.p,g.c))}/day</div><div class="days">${[...Array(10)].map((_,d)=>`<i class="${d<m.paid?'d':''}">${d<m.paid?'✓':d+1}</i>`).join('')}</div><button class="btn y sm" style="margin-top:8px" onclick="out(api.pay(${i}))">Pay today's instalment</button></div>`}).join(''):'<p class="mu card">You have not joined any group yet.</p>'}`
 if(t=='wallet'&&v=='loans')return `${hd('My Loans','wallet')}<div class="card"><p class="mu">Request help to pay contributions. Lenders agree terms with you outside Buyoll. A KSh 50 processing fee is deducted once per loan.</p><input id="la" type="number" placeholder="Amount e.g. 1000"><button class="btn y bl" onclick="if(la.value){S.reqs.unshift({who:S.name,score:700,amt:+la.value,loc:'Nairobi',me:1});save();toast('Loan request posted to lenders');go('wallet')}">Request Loan</button></div>`

if(t=='products')return hd('Product moderation')+S.products.map(p=>{const h=S.hidden.includes(p.id),f=S.feat.includes(p.id);return `<div class="card"><div class="row">${pim(p,56,'56px')}<div style="flex:1"><b>${p.n}</b> ${h?'<span class="bd r">Hidden</span>':'<span class="bd">Live</span>'} ${f?'<span class="bd p">⭐ Featured</span>':''}<div class="mu">${p.m} · ${K(p.p)} · ${p.g.length} groups</div></div></div><div class="row" style="margin-top:8px"><button class="btn sm o" onclick="tg(${p.id})">${h?'Show':'Hide'}</button><button class="btn sm o" onclick="ft(${p.id})">${f?'Unfeature':'Feature'}</button><button class="btn sm o" onclick="rm(${p.id})">Remove</button></div></div>`}).join('');
if(t=='groups')return hd('Group monitoring')+(gs.map(({p,g})=>`<div class="grp"><div><b>${p.n} · Group ${g.n}</b><div class="mu">${g.j}/${g.c} members · Rotation ${g.done?g.c:g.rot}/${g.c} · Day ${g.done?g.c*10:dn(g)}/${g.c*10} · Mod: ${g.r[0].n}</div></div><button class="btn sm o" onclick="go('groups','track','${p.id}:${g.n}')">View</button></div>`).join('')||'<p class="mu card">No active groups.</p>');
if(t=='fin')return hd('Finance')+`<div class="bal"><span class="mu">Admin revenue wallet</span><h2>${K(S.rev)}</h2></div><div class="stats"><div><b style="font-size:15px">${K(S.subRev||0)}</b>Subscriptions</div><div><b style="font-size:15px">${K(S.fee||0)}</b>Loan fees</div><div><b>${S.deposits.length}</b>Deposits</div></div><h3 style="margin-top:12px">All deposits</h3>`+S.deposits.map(d=>`<div class="card"><div class="row sp"><b>${d.by} · ${d.role||'member'}</b><span class="bd ${d.st=='declined'?'r':d.st=='pending'?'p':''}">${d.st}</span></div><div class="mu">${K(d.amt)} · ${d.code}${d.reason?' · Reason: '+d.reason:''}</div></div>`).join('');
if(t=='set')return hd('Platform settings')+`<div class="card"><label class="mu">M-Pesa Till / Paybill shown in deposit pop-ups</label><input id="st" value="${S.till}"><label class="mu">Home banner headline</label><input id="sb" value="${S.banner}"><button class="btn y bl" onclick="ss()">Save settings</button></div><div class="card mu">Loan processing fee: KSh 50 once per loan · Plans: KSh 250 / 750 / 1,500 for 30 days</div>`;
return hd('Admin Panel')+`<div class="stats"><div><b>${pd.length}</b>Pending deposits</div><div><b style="font-size:15px">${K(S.rev)}</b>Revenue</div><div><b>${S.users}</b>Users</div></div><div class="stats" style="margin-top:8px"><div><b>${mer().length}</b>Merchants</div><div><b>${S.products.length}</b>Products</div><div><b>${gs.length}</b>Active groups</div></div><h3 style="margin-top:12px">M-Pesa deposit approval</h3>`+(pd.map(dcard).join('')||'<p class="mu card">No pending deposits.</p>')+`<div class="card"><svg viewBox="0 0 300 100" width="100%"><path d="M0 90 L30 65 60 75 90 40 120 55 150 28 180 50 210 22 240 36 270 10 300 18" stroke="#7c3aed" fill="none" stroke-width="3"/></svg></div>`};

const oldM=V.member;
V.member=function(){const t=S.tab,v=S.view,sel=S.sel;
if(t=='home'&&v=='prod'){const p=prod(sel);return hd('Product Details','home')+`<div class="two"><div style="border-radius:14px;overflow:hidden">${sq(p)}</div><div><span class="price" style="font-size:28px">${K(p.p)}</span><span class="old">${K(p.o)}</span> ${dc(p)?`<span class="bd r">-${dc(p)}% OFF</span>`:''}<h2 style="font-size:22px;margin:8px 0">${p.n}</h2><p class="mu">${p.cat} · ${p.stock} in stock</p><p style="margin:8px 0">${p.desc}</p><div class="card row">${ini(p.m)}<div><b>${p.m}</b> <span class="bd">✔ Verified</span><div class="mu">📍 ${p.loc}</div></div></div><div class="card mu">💸 Pay little by little: join a group and pay daily for 10 days. Each 10-day round one member receives the product, in joining order, until everyone has theirs.</div></div></div><h3 style="margin:14px 0 4px">Choose a group (1–10 members)</h3><p class="mu" style="margin-bottom:8px">Fewer members = higher daily payment but you get the product sooner.</p><div class="gcs">${p.g.map(g=>gcard(p,g)).join('')}</div>`}
if(t=='groups'&&v=='track'){const [pid,gn]=String(sel).split(':'),p=prod(pid),g=grp(pid,gn),d=+inst(p.p,g.c),im=g.r[0]&&g.r[0].me,all=g.r.length&&g.r.every(x=>x.d>=10),cur=g.done?g.c*10:dn(g);
return hd('Payment Tracking','groups')+`<div class="card"><b>${p.n} at ${K(p.p)}</b><div class="mu">Group ${gn} · ${g.c} members · Daily ${K(d)} · Rotation ${g.done?g.c:g.rot} of ${g.c}</div><div style="background:#ece8f6;border-radius:8px;height:8px;margin:8px 0"><div style="width:${cur/(g.c*10)*100}%;background:var(--pu);height:8px;border-radius:8px"></div></div><div class="mu">Day ${cur} of ${g.c*10} · Last member receives on day ${g.c*10}</div><div class="mu">Moderator: ${g.r[0]?g.r[0].n:'—'}${im?' · tap the next day to tick a payment':''}</div></div>`
+ledger(p,g,d,im,pid,gn)
+(g.r.length<g.c?`<p class="mu">${g.c-g.r.length} slot(s) open</p>`:'')+``+(g.done?'<div class="card">✅ All members have received the product. Find another product to join.</div>':im&&all?`<button class="btn y bl" onclick="rot('${pid}','${gn}')">Complete rotation ${g.rot} and hand over product</button>`:'')}
if(t=='groups'&&v=='list'){const p=prod(sel);return hd('Groups You Can Join','groups')+`<div class="card row">${pim(p,70,'90px')}<div><b>${p.n}</b><div class="price">${K(p.p)}</div><span class="mu">${p.m} · 📍 ${p.loc}</span></div></div><div class="gcs">${p.g.map(g=>gcard(p,g)).join('')}</div>`}
if(t=='groups')return hd('Groups You Can Join')+`<input placeholder="🔍 Search groups..." oninput="gs2(this.value)"><button class="btn o sm" onclick="go('wallet','mine')">My Groups (${S.my.length})</button><div id="gl">${allG('')}</div>`;
if(t=='wallet'&&v=='mine')return hd('My Groups','wallet')+(S.my.length?S.my.map((m,i)=>{const p=prod(m.pid),g=grp(m.pid,m.g),me=g.r.find(x=>x.me),pos=me?g.r.indexOf(me)+1:0;return `<div class="card"><b>${p.n}</b> <span class="bd ${m.st=='ok'?'':'p'}">${m.st=='ok'?'Active':'Pending'}</span><div class="mu">Group ${m.g} · ${K(inst(p.p,g.c))}/day${me?' · Position '+pos+'/'+g.c+' · '+me.d+'/10 days this round':''}</div>${me?`<div class="mu">🎁 You receive the product on day <b>${pos*10}</b> (${Math.max(0,pos*10-dn(g))} days left)</div>`:''}${m.st=='ok'?`<div class="row" style="margin-top:8px"><button class="btn y sm" onclick="out(api.pay(${i}))">Pay today (wallet)</button><button class="btn o sm" onclick="go('groups','track','${p.id}:${m.g}')">Track</button></div>`:`<button class="btn o sm" style="margin-top:8px" onclick="api.ok(${i});out()">Demo: moderator approves</button>`}</div>`}).join(''):'<p class="mu card">You have not joined any group yet.</p>');
if(t=='wallet'&&v=='loans'){const my=S.lr.filter(r=>r.me);return hd('My Loans','wallet')+`<div class="card mu">Need help paying your daily contribution? Choose a lender and send a request. Terms are agreed with the lender outside Buyoll. When approved, the loan is deposited into your wallet (KSh 50 platform fee deducted once).</div><h3>Choose a lender</h3>`+LN.map(l=>`<div class="grp">${ini(l.n)}<div><b>${l.n}</b><div class="mu">📍 ${l.loc} · ${l.range}</div></div><button class="btn sm" onclick="lm(${l.id})">Request</button></div>`).join('')+`<h3 style="margin-top:12px">My requests</h3>`+(my.length?my.map(r=>`<div class="grp"><div><b>${K(r.amt)}</b> · ${LN.find(l=>l.id==r.lender).n}<div class="mu">${r.ctx}</div></div><span class="bd ${r.st=='declined'?'r':r.st=='pending'?'p':''}">${r.st}</span></div>`).join(''):'<p class="mu">No requests yet.</p>')}
if(t=='home')return `<div class="ban row sp" style="flex-wrap:wrap"><div><h2>${S.banner}</h2><p style="margin:4px 0 10px" class="mu">Chamaa &amp; Lipa Mdogo Mdogo marketplace</p><button class="btn y sm" onclick="go('groups')">Browse groups →</button></div></div>
<div class="steps"><div>🛍️<br><b>1. Pick a product</b></div><div>👥<br><b>2. Join a group</b></div><div>💸<br><b>3. Pay daily, 10 days</b></div></div>
<div class="row" style="margin:14px 0 8px"><input style="margin:0" placeholder="🔍 Search products or merchants..." value="${S.q}" oninput="sr(this.value)"><select style="width:auto;margin:0" onchange="sm(this.selectedIndex-1)"><option>All merchants</option>${mer().map(m=>`<option ${S.mf==m?'selected':''}>${m}</option>`).join('')}</select></div>
<div class="row" style="overflow-x:auto;margin-bottom:10px">${CATS.map(c=>`<button class="btn sm ${S.cf==c?'':'o'}" style="white-space:nowrap" onclick="sc('${c}')">${c}</button>`).join('')}</div>
<div class="row sp"><h3>Latest announcements</h3><span class="mu">${mer().length} merchants</span></div><div class="pg" id="pf" style="margin-top:8px">${feed(S.q)}</div>`;
return oldM()};
V.lender=function(){const t=S.tab;if(t=='wallet')return walletView(S.lw);if(t=='profile')return prof();
const rq=S.lr.filter(r=>r.lender==ME&&r.st=='pending'),ls=S.loans.filter(l=>l.lender==ME),hist=`<div class="card">${ls.map(l=>`<div class="tx"><b style="flex:1">${l.id} · ${l.who}</b>${K(l.amt)} <span class="bd ${l.st=='Paid'?'p':''}">${l.st}</span></div>`).join('')||'<p class="mu">No loans yet</p>'}</div>`;
if(t=='loans')return hd('My Loans')+hist;
return hd('Lender Dashboard')+`<div class="ban"><h2 style="font-size:24px">Lend. Empower. Earn.</h2><p class="mu">Mwangi Credit · help members pay their daily contributions</p></div><div class="stats"><div><b style="font-size:16px">${K(S.lent)}</b>Total lent</div><div><b>${ls.filter(l=>l.st=='Active').length}</b>Active loans</div><div><b>${rq.length}</b>Requests</div></div><div class="card row sp"><span>Lender wallet</span><b>${K(S.lw)}</b></div>
<h3>Member requests</h3>`+(rq.map(r=>`<div class="card"><div class="row sp"><b>${r.by}</b><b style="color:#6d28d9">${K(r.amt)}</b></div><div class="mu">Credit score ${r.score} · ${r.loc}<br>${r.ctx}</div><p class="mu" style="margin:6px 0">You pay ${K(r.amt)} from your wallet. Member receives ${K(r.amt-50)}; KSh 50 platform fee is deducted once. Repayment is agreed outside Buyoll.</p><div class="row"><button class="btn y sm" onclick="out(api.decideLoan(${r.id},1))">Approve &amp; deposit</button><button class="btn o sm" onclick="api.decideLoan(${r.id},0);out()">Decline</button></div></div>`).join('')||'<p class="mu card">No pending requests.</p>')+`<h3>Loan history</h3>`+hist};
function gc(pid,i,d){const g=prod(pid).g[i];if(g.j)return toast('Group has members - locked');g.c=Math.min(10,Math.max(1,g.c+d));out()}
function ag(id){const p=prod(id);if(!S.plan.active)return toast('Subscription expired');if(p.g.length>=10)return toast('Plan limit: 10 groups per product');p.g.push({n:'ABCDEFGHIJ'[p.g.length],c:1,r:[],j:0,rot:1});out()}
function up(){if(!S.plan.active)return toast('Subscribe first to publish products');modal(`<h3>Upload Product</h3><input id="pn" placeholder="Product name"><select id="pc">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><div class="row"><input id="pp" type="number" placeholder="Selling price"><input id="po" type="number" placeholder="Previous price"></div><div class="row"><input id="ps" type="number" placeholder="Stock"><input id="pl" placeholder="Shop location" value="Tom Mboya St, Nairobi CBD"></div><input id="pd" placeholder="Description"><button class="btn y bl" onclick="pu()">Publish &amp; add groups</button>`)}
function pu(){const v=i=>document.getElementById(i).value;if(!v('pn')||!v('pp'))return toast('Enter name and price');if(mine().length>=S.plan.max)return toast(S.plan.n+' limit: '+S.plan.max+' products. Upgrade your plan.');const id=Date.now();S.products.unshift({id,n:v('pn'),cat:v('pc'),p:+v('pp'),o:+v('po')||+v('pp'),m:BM,loc:v('pl'),stock:+v('ps')||10,e:'📦',t:'Just now',desc:v('pd')||'New product. Pay little by little.',g:G([1,2,3])});cm();toast('Published to announcements');go('home','add',id)}
function subM(){const f=t=>PL.map((x,i)=>x.term==t?`<div class="grp"><div><b>${x.n} · ${K(x.price)}</b><div class="mu">${x.max} products on the announcement feed · 10 groups per product${t=='Annual'?' · saves '+K(x.price/ (x.days/30)*0+({2500:500,8500:500,17000:1000})[x.price]):''}</div></div><button class="btn sm" onclick="cm();sb(${i})">Pay</button></div>`:'').join('');modal(`<h3>Choose a plan</h3><b>Monthly · 30 days</b>${f('Monthly')}<b>Annual · 365 days</b>${f('Annual')}<p class="mu">Paid from your merchant wallet. Deposit first if the balance is low.</p>`)}
function sb(i){const x=PL[i];if(S.mw<x.price)return toast('Insufficient wallet balance - deposit first');S.mw-=x.price;S.rev+=x.price;S.subRev=(S.subRev||0)+x.price;S.plan={...x,active:true,ts:Date.now()+x.days*864e5,exp:new Date(Date.now()+x.days*864e5).toLocaleDateString()};S.tx.unshift({t:x.n+' '+x.term+' subscription',a:-x.price,d:'Just now',k:'p',r:'merchant'});toast(x.term+' plan active for '+x.days+' days');out()}
V.merchant=function(){const t=S.tab,v=S.view,pl=S.plan,mp=mine();if(pl.ts&&pl.ts<Date.now())pl.active=false;
if(v=='add'){const p=prod(S.sel);return hd('Add Groups to Product','home')+`<div class="card row">${pim(p,60,'80px')}<div><b>${p.n}</b><div class="price">${K(p.p)}</div></div></div><div class="card mu" style="text-align:center">Create up to 10 groups (1–10 members each). Members join and the product is delivered every 10 days.</div>`+p.g.map((g,i)=>`<div class="grp"><span style="font-size:24px">👥</span><div><b>Group ${g.n} – ${g.c} Member${g.c>1?'s':''}</b><div class="mu">${K(inst(p.p,g.c))}/day · cycle ${g.c*10} days${g.j?' · locked ('+g.j+' joined)':''}</div></div><button class="btn sm" onclick="gc(${p.id},${i},-1)">−</button><button class="btn sm" onclick="gc(${p.id},${i},1)">+</button></div>`).join('')+`<button class="btn bl" onclick="ag(${p.id})">Add More Groups</button><button class="btn y bl" style="margin-top:8px" onclick="toast('Groups saved');go('home')">Save Groups</button>`}
if(t=='wallet')return walletView(S.mw);if(t=='profile')return prof();
const list=mp.map(p=>`<div class="card" style="margin:0"><div class="row">${pim(p,80,'80px')}<div style="flex:1"><b>${p.n}</b><div><span class="price" style="font-size:16px">${K(p.p)}</span><span class="old">${K(p.o)}</span></div><div class="mu">📍 ${p.loc} · ${p.stock} in stock</div></div></div><div class="row" style="margin-top:8px"><button class="btn sm bl" onclick="go('home','add',${p.id})">+ Add group</button><button class="btn sm o bl" onclick="toast('${p.g.reduce((a,g)=>a+g.j,0)} members joined')">Sales</button></div></div>`).join('');
if(t=='products')return hd('My Products')+`<div class="two">${list}</div>`;
const ac=mp.flatMap(p=>p.g.filter(g=>g.j).map(g=>`<div class="grp"><div><b>${p.n} · Group ${g.n}</b><div class="mu">${g.j}/${g.c} members · Day ${g.done?g.c*10:dn(g)}/${g.c*10}${g.done?' · completed':' · Next delivery: <b>'+(g.r[g.rot-1]?g.r[g.rot-1].n:'open slot')+'</b>'}</div></div></div>`)).join('')||'<p class="mu card">No members have joined yet.</p>';
return hd('Merchant Zone')+`<div class="card row"><span style="font-size:34px">🏪</span><div><b>${BM}</b><br><span class="bd">✔ Verified Merchant</span></div></div><div class="stats"><div><b>${mp.length}/${pl.max}</b>Products</div><div><b>${mp.reduce((a,p)=>a+p.g.length,0)}</b>Groups</div><div><b style="font-size:15px">${K(S.mw)}</b>Wallet</div></div><div class="card"><b>${pl.n} · ${pl.term||'Monthly'}</b> <span class="bd ${pl.active?'':'r'}">${pl.active?'Active':'Expired'}</span><div class="mu">Expires ${pl.exp} · ${mp.length}/${pl.max} products on announcements · 10 groups each</div><button class="btn sm" style="margin-top:6px" onclick="subM()">Subscribe / Renew</button></div>${pl.active?'<button class="btn y bl" style="margin:8px 0" onclick="up()">+ Upload Product</button>':'<div class="card" style="border-color:#f59e0b"><b>🔒 Subscribe to post products</b><div class="mu">Your subscription is not active. Choose a 30-day plan to publish products and create groups. Existing groups keep running.</div><button class="btn y sm" style="margin-top:6px" onclick="subM()">Subscribe now</button></div>'}<h3>Members &amp; deliveries</h3>${ac}<h3 style="margin-top:12px">My Products</h3><div class="two">${list}</div>`};
draw();
</script></body></html>
